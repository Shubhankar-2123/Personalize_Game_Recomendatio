{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2>Edit Profile</h2>
    <form method="POST" action="{{ url_for('edit_profile') }}">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required minlength="4" maxlength="20">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ user.email or '' }}">
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('profile') }}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>
{% endblock %}
